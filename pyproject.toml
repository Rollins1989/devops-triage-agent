[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-triage-agent"
version = "0.1.0"
description = "A reliability-first, multi-agent DevOps incident triage system built around a real MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rollins1989" }]
dependencies = [
  "anthropic>=1.4.0",
  "mcp>=1.9.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
devops-triage = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.setuptools]
packages = ["src", "src.agents"]
